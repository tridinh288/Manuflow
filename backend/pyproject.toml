[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "manuflow"
version = "0.1.0"
description = "Student simulation of an internal manufacturing production and inventory backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "pymysql>=1.1",
    # PyMySQL needs it for MySQL 8's default caching_sha2_password authentication.
    "cryptography>=42",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S608 (SQL built from strings) is part of "S" and required by B16.
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
# The local alembic/ folder must not shadow the alembic library.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "concurrency: uses several real DB connections on separate threads (B15)",
]
