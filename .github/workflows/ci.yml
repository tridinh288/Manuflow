name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint, types, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - name: pip-audit (B16)
        run: pip-audit --skip-editable

  test:
    name: Tests on MySQL 8.0
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-root-only
      MYSQL_APP_PASSWORD: ci-app-only
      MYSQL_MIGRATOR_PASSWORD: ci-migrator-only
      TEST_DATABASE_URL: mysql+pymysql://manuflow_app:ci-app-only@127.0.0.1:3306/manuflow_test?charset=utf8mb4
      TEST_MIGRATION_DATABASE_URL: mysql+pymysql://manuflow_migrator:ci-migrator-only@127.0.0.1:3306/manuflow_test?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Create databases and least-privilege users
        working-directory: .
        env:
          MYSQL_HOST: 127.0.0.1
        run: sh docker/mysql/init/01-databases-and-users.sh
      - run: pytest -q
